# Backend suite against real PostgreSQL 16 + Redis 7 using the pinned lockfile. Includes the 215-strategy
# preservation test (IDs, configuration and source hashes).
name: backend

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "mt5-connector/**"
      - "windows-connector/**"
      - "infrastructure/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine3.20
        env: {POSTGRES_USER: rr, POSTGRES_PASSWORD: rr, POSTGRES_DB: rr_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rr -d rr_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.1-alpine3.20
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (connector UI tests run offscreen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (pinned)
        run: pip install -r requirements-dev.txt
      - name: Strategy preservation (215 baseline strategies)
        run: python -m pytest -q tests/test_preservation.py
      - name: Backend suite
        run: python -m pytest -q
      - name: MT5 connector suite
        working-directory: mt5-connector
        run: python -m pytest -q
      - name: Local stack compose file (secrets required, trading worker never in a default up)
        working-directory: .
        run: |
          ! docker compose -f infrastructure/compose.yml config -q 2>/dev/null
          export RR_ONE_DB_PASSWORD=x RR_ONE_REDIS_PASSWORD=x RR_ONE_JWT_SECRET=x RR_ONE_ENCRYPTION_KEY=x RR_ONE_BRIDGE_SECRET=x
          docker compose -f infrastructure/compose.yml config -q
          ! docker compose -f infrastructure/compose.yml config --services | grep -qx trading-worker
          docker compose -f infrastructure/compose.yml --profile trading config --services | grep -qx trading-worker
          [ "$(docker compose -f infrastructure/compose.yml config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); print(sum(len(s.get("ports",[])) for s in c["services"].values()))')" = 1 ]
          docker compose -f infrastructure/compose.yml config --format json | python3 -c 'import json,sys; p=json.load(sys.stdin)["services"]["gateway"]["ports"][0]; assert p["host_ip"]=="127.0.0.1", p'
      - name: Windows connector suite (offscreen)
        working-directory: windows-connector
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pytest -q
